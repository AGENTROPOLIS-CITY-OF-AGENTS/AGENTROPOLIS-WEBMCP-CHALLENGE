name: Design contract

on:
  pull_request:
    paths:
      - "DESIGN.md"
      - "docs/DESIGN-HARNESS.md"
      - "scripts/design-harness/**"
      - "src/**"
      - "packages/ui-vault/**"
      - "package.json"
  push:
    branches: ["main"]
    paths:
      - "DESIGN.md"
      - "docs/DESIGN-HARNESS.md"
      - "scripts/design-harness/**"
      - "src/**"
      - "packages/ui-vault/**"
      - "package.json"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run validate:design-harness
