name: Pages preview artifact

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pages-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    if: >-
      ${{
        github.event.pull_request.draft == false &&
        github.event.pull_request.head.repo.full_name == github.repository
      }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build preview artifact
        run: npm run build

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: pages-preview-pr-${{ github.event.pull_request.number }}-${{ github.sha }}
          path: dist
          retention-days: 7

      - name: Comment preview target
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- agentropolis-pages-preview -->';
            const body = [
              marker,
              '### AGENTROPOLIS preview artifact',
              '',
              `Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `Artifact: pages-preview-pr-${context.payload.pull_request.number}-${context.sha}`,
              '',
              'Deterministic browser target:',
              '1. Download the artifact from this run.',
              '2. Serve the extracted `dist/` directory with `npm run preview -- --host 127.0.0.1 --port 4173` or an equivalent static server.',
              '3. Open `http://127.0.0.1:4173` in a browser.',
              '',
              'Preview deployment is branch-scoped and production Pages is unchanged.',
            ].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              per_page: 100,
            });

            const existing = comments.find((comment) => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body,
              });
            }
